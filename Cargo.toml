[package]
name = "static-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["http2"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["compression-gzip", "compression-br", "compression-deflate", "set-header", "cors", "trace", "limit"] }
http = "1.0"
http-body-util = "0.1"
mime = "0.3"
mime_guess = "2.0"
percent-encoding = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
bytes = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.0"
walkdir = "2.0"
dashmap = "5.0"
parking_lot = "0.12"
async-stream = "0.3"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.0"
